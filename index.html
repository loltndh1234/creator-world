<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101014"><title>Creator World — 모바일 게임</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Creator World"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><style>
:root{color-scheme:dark;--bg:#101014;--card:#1d1e24;--surface:#292a32;--line:#373942;--text:#f5f5f7;--muted:#a8a8b4;--red:#e73a44;--green:#5ee0ad}*{box-sizing:border-box}body{margin:0;background:#09090c;color:var(--text);font:15px/1.5 system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}#app{max-width:470px;min-height:100dvh;margin:auto;background:var(--bg);padding-bottom:92px}header{background:#141419;border-bottom:1px solid var(--line);padding:19px 19px 15px;position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:17px;font-weight:900;letter-spacing:.3px}.brand b{background:var(--red);padding:5px 7px;border-radius:8px;margin-right:8px}.dim{color:var(--muted);font-size:12px}.money{font-size:13px;font-weight:800;text-align:right}.hud{display:flex;gap:7px;margin-top:11px}.chip{background:#292a31;color:#ddd;border-radius:40px;padding:4px 9px;font-size:11px}.body{padding:20px 16px 32px}.hero{background:linear-gradient(145deg,#30272b,#1c1d23 60%);border:1px solid #433238;border-radius:19px;padding:19px;margin-bottom:16px}.eyebrow{font-size:11px;color:#f7aab0;letter-spacing:1px;font-weight:800}.big{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.3}.split{display:flex;justify-content:space-between;gap:10px;align-items:center}.section{font-size:17px;font-weight:850;margin:23px 2px 11px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.stat{font-size:21px;font-weight:850;margin-top:3px}.label{font-size:12px;color:var(--muted)}.btn{width:100%;border:0;color:white;border-radius:12px;padding:13px 14px;background:var(--red);font-weight:800;margin-top:11px}.btn:disabled{opacity:.36;cursor:not-allowed}.btn.alt{background:#34363e}.btn.light{background:#322429;color:#ffb8bd}.tiny{font-size:12px;color:var(--muted)}.stack{display:flex;flex-direction:column;gap:10px}.option{background:#25262d;border:1px solid #3c3d45;color:#ddd;border-radius:12px;padding:12px;text-align:left;width:100%;font-size:13px}.option.active{border:2px solid var(--red);background:#342329;color:white;padding:11px}.option strong{display:block;font-size:14px}.option span{font-size:11px;color:var(--muted)}.field{display:block;width:100%;margin-top:8px;background:#2b2d34;color:#fff;border:1px solid #494b56;padding:12px;border-radius:12px}.progress{height:7px;background:#393b44;border-radius:6px;overflow:hidden;margin-top:8px}.progress>div{background:var(--red);height:100%}.red{color:#ff7f85}.green{color:var(--green)}.divider{border:0;border-top:1px solid var(--line);margin:14px 0}.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);max-width:470px;width:100%;background:#19191f;border-top:1px solid #35363e;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 5px calc(9px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#8e909c;font-size:11px;padding:5px 0}.nav button.active{color:#ff646e;font-weight:800}.nav .ic{display:block;font-size:21px;margin-bottom:2px}.pill{border-radius:100px;background:#3c2830;color:#ffafb5;font-size:11px;padding:4px 9px;font-weight:800}.video{padding:12px 0;border-bottom:1px solid #383a43}.video:last-child{border:0}.modalbg{position:fixed;inset:0;background:#000b;z-index:30;display:flex;justify-content:center;align-items:center;padding:20px}.modal{width:min(420px,100%);background:#222329;border:1px solid #46474f;border-radius:22px;padding:22px;max-height:80dvh;overflow:auto}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);max-width:420px;width:calc(100% - 40px);background:#41434e;padding:14px;border-radius:12px;z-index:20;text-align:center;box-shadow:0 4px 30px #0009}.bar{display:flex;height:10px;background:#34353d;border-radius:8px;overflow:hidden;margin:10px 0}.bar div{background:#e73a44}.rankrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #35363e}.rankrow:last-child{border:none}.intro{padding:60px 24px 30px}.intro h1{font-size:39px;line-height:1.1;margin:20px 0}.intro input{margin:8px 0 18px}.notice{background:#2c252a;border:1px solid #49333b;padding:13px;border-radius:12px;font-size:12px;color:#ffc6c9;margin-top:12px}</style></head><body><div id="app"></div><script>
const K='creator_world_playable_v1';const G=['게임','먹방','브이로그','엔터테인먼트','테크','정보·교육'];const topics=['공포 게임 도전','매운 음식 먹방','평범한 일상 브이로그','24시간 챌린지','신제품 리뷰','알아두면 좋은 꿀팁'];const price=[{id:'mic',name:'보급형 마이크',p:150000,b:8,desc:'콘텐츠 품질 +8'},{id:'light',name:'촬영 조명',p:200000,b:7,desc:'콘텐츠 품질 +7'},{id:'pc',name:'편집용 PC',p:800000,b:15,desc:'콘텐츠 품질 +15'},{id:'camera',name:'전문 카메라',p:1500000,b:18,desc:'콘텐츠 품질 +18'}];const fx=n=>Math.round(n).toLocaleString('ko-KR');const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));let state=null,tab='home',form={topic:0,format:'long',editing:'normal',title:'curious',thumb:'expressive'},modal=null,toast='';function save(){localStorage.setItem(K,JSON.stringify(state))}try{state=JSON.parse(localStorage.getItem(K))}catch{}const app=document.querySelector('#app');const btn=(txt,fn,cl='btn',disabled=false)=>`<button class="${cl}" ${disabled?'disabled':''} onclick="${fn}">${txt}</button>`;function trends(day){return G.map((g,i)=>({g,score:clamp(Math.round(54+30*Math.sin((day+i*8)/11+i*1.2)+12*Math.sin(day/5+i)),20,95)}))}function tag(t){return `<span class="pill">${t}</span>`}function money(n){return `₩${fx(n)}`}function notify(t){toast=t;render();setTimeout(()=>{toast='';render()},2200)}function newGame(){const name=document.getElementById('newName').value.trim().slice(0,20)||'나의 채널';const genre=+document.getElementById('newGenre').value;state={name,genre,day:1,ap:4,energy:100,maxEnergy:100,cash:300000,subs:0,views:0,earned:0,rep:70,loyalty:50,gear:[],videos:[],nextId:1,logs:[],events:[],streak:0,competitors:[{name:'겜돌이TV',subs:850},{name:'먹방여왕',subs:1200},{name:'챌린지킹',subs:2100},{name:'테크박사',subs:760}]};tab='home';save();render()}function nav(t){tab=t;render()}function choose(k,v){form[k]=v;render()}function setup(){app.innerHTML=`<main class="intro"><div class="brand"><b>CW</b> CREATOR WORLD</div><h1>구독자 0명부터<br><span class="red">크리에이터의 꿈</span></h1><p style="color:#a8a8b4">나만의 채널을 만들고 영상 제작, 알고리즘, 트렌드, 장비 투자를 통해 성장해 보세요.</p><div class="section">채널 이름</div><input id="newName" class="field" placeholder="예: 따융TV" maxlength="20"><div class="section">시작 장르</div><select id="newGenre" class="field">${G.map((g,i)=>`<option value="${i}">${g}</option>`).join('')}</select>${btn('채널 개설하고 시작하기','newGame()')}<div class="notice">브라우저에 게임이 자동 저장됩니다. 같은 기기와 브라우저에서 다시 열면 이어할 수 있어요.</div></main>`}function head(){return `<header><div class="top"><div><div class="brand"><b>CW</b> CREATOR WORLD</div><div class="dim">DAY ${state.day} · ${esc(state.name)}</div></div><div class="money">${money(state.cash)}<div class="dim">보유 자금</div></div></div><div class="hud"><div class="chip">⚡ AP ${state.ap}/4</div><div class="chip">♥ 체력 ${state.energy}/100</div><div class="chip">★ 평판 ${state.rep}/100</div></div></header>`}function foot(){return `<nav class="nav">${[['home','⌂','홈'],['create','▣','제작'],['studio','▥','스튜디오'],['social','♧','소셜'],['business','▤','사업']].map(a=>`<button class="${tab===a[0]?'active':''}" onclick="nav('${a[0]}')"><span class="ic">${a[1]}</span>${a[2]}</button>`).join('')}</nav>`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function home(){const tr=trends(state.day).sort((a,b)=>b.score-a.score);return `<div class="hero"><div class="eyebrow">MY CHANNEL · ${G[state.genre]}</div><div style="margin-top:12px;color:#bdbdc8">현재 구독자</div><div class="big">${fx(state.subs)} <span style="font-size:14px">명</span></div><div class="split" style="margin-top:14px"><span>👁 누적 조회수 ${fx(state.views)}</span>${tag(state.subs>=1000?'수익 창출 가능':'성장 중')}</div></div><div class="grid"><div class="card"><div class="label">영상 개수</div><div class="stat">${fx(state.videos.length)}개</div></div><div class="card"><div class="label">누적 광고 수익</div><div class="stat">${money(state.earned)}</div></div></div><div class="section">🔥 오늘의 트렌드</div><div class="card">${tr.slice(0,3).map(t=>`<div class="split" style="margin:8px 0"><span>${t.g}</span><b>${t.score}/100</b></div><div class="progress"><div style="width:${t.score}%"></div></div>`).join('')}</div>${btn('＋ 새로운 영상 만들기',"nav('create')")}${btn('다음 날 진행 →','nextDay()','btn alt')}<div class="section">오늘의 팁</div><div class="card tiny">영상의 최종 조회수는 7일에 걸쳐 증가해요. 트렌드에 맞는 영상을 올리고 다음 날로 진행해 보세요.</div>${state.logs.length?`<div class="section">최근 활동</div><div class="card">${state.logs.slice(0,4).map(l=>`<div class="video tiny">${esc(l)}</div>`).join('')}</div>`:''}`}
function choice(k,v,title,desc){return `<button class="option ${form[k]===v?'active':''}" onclick="choose('${k}','${v}')"><strong>${title}</strong>${desc?`<span>${desc}</span>`:''}</button>`}function create(){const topic=+form.topic,quality=computeQuality();const cost=form.editing==='premium'?3:form.format==='long'?2:1,energy=cost===3?45:cost===2?30:15;return `<div class="section" style="margin-top:0">영상 제작 스튜디오</div><div class="card"><b>① 콘텐츠 기획</b><div class="stack" style="margin-top:12px">${topics.map((t,i)=>choice('topic',String(i),t,`${G[i]} · 트렌드 ${trends(state.day)[i].score}점`)).join('')}</div></div><div class="card"><b>② 영상 형식</b><div class="stack" style="margin-top:12px">${choice('format','short','쇼츠','빠른 조회수 확보 · 낮은 광고 단가')}${choice('format','long','롱폼','안정적인 팬덤 · 높은 광고 단가')}</div></div><div class="card"><b>③ 편집 수준</b><div class="stack" style="margin-top:12px">${choice('editing','quick','빠른 편집','품질 보너스 없음')}${choice('editing','normal','일반 편집','품질 +12')}${choice('editing','premium','고급 편집','품질 +26 · AP 3')}</div></div><div class="card"><b>④ 제목 전략</b><div class="stack" style="margin-top:12px">${choice('title','honest','정직한 정보형','클릭률 보통 · 시청자 신뢰')}${choice('title','curious','호기심 유발형','클릭률과 만족도의 균형')}${choice('title','clickbait','과장된 자극형','클릭률 상승 · 평판 위험')}</div></div><div class="card"><b>⑤ 썸네일 스타일</b><div class="stack" style="margin-top:12px">${choice('thumb','expressive','표정 강조형','높은 초기 클릭률')}${choice('thumb','clean','깔끔한 디자인','콘텐츠 정보 전달')}${choice('thumb','minimal','미니멀형','차별화된 디자인')}</div></div><div class="card"><div class="split"><span>예상 제작 품질</span><b>${quality} / 100</b></div><div class="progress"><div style="width:${quality}%"></div></div><div class="tiny" style="margin-top:10px">필요 AP ${cost} · 체력 ${energy}</div>${btn('영상 업로드','upload()', 'btn',state.ap<cost||state.energy<energy)}${state.ap<cost||state.energy<energy?'<div class="tiny red" style="margin-top:8px">AP 또는 체력이 부족해요. 다음 날 진행해 주세요.</div>':''}</div>`}
function computeQuality(){return clamp(42+(form.editing==='premium'?26:form.editing==='normal'?12:0)+(form.format==='long'?5:0)+state.gear.reduce((n,id)=>n+(price.find(p=>p.id===id)?.b||0),0),10,100)}function upload(){const cost=form.editing==='premium'?3:form.format==='long'?2:1,energy=cost===3?45:cost===2?30:15;if(state.ap<cost||state.energy<energy)return;const t=+form.topic,q=computeQuality(),trend=trends(state.day)[t].score,match=t===state.genre?85:55,click=form.title==='clickbait'?24:form.title==='curious'?17:10,thumb=form.thumb==='expressive'?20:form.thumb==='clean'?12:8;let score=trend*.25+q*.3+match*.2+click*.15+thumb*.1;let luck=0.72+Math.random()*.58;let viral=Math.random();let mult=viral<.012?20+Math.random()*12:viral<.075?5+Math.random()*7:viral<.24?1.5+Math.random()*1.5:1;const scale=Math.pow(1.065,score-45);const final=clamp(Math.round((500+state.subs*.42)*scale*(form.format==='short'?1.9:1)*luck*mult),50,40000000);const conv=clamp(.003+(q-50)*.00013+(match-50)*.00004-(form.format==='short'?.001:0)-(form.title==='clickbait'?.0015:0),.001,.023);const title=topics[t];const v={id:state.nextId++,title,day:state.day,final,views:0,subs:0,conv,format:form.format,quality:q,viral:mult>=5,earned:0};state.videos.unshift(v);state.ap-=cost;state.energy-=energy;if(form.title==='clickbait')state.rep=clamp(state.rep-2,0,100);state.streak++;settleVideo(v,0);state.logs.unshift(`DAY ${state.day}: '${title}' 업로드 · 초기 조회수 ${fx(v.views)}회`);save();modal={title:v.viral?'🔥 영상이 알고리즘을 탔어요!':'✅ 영상 업로드 완료',msg:`${title}<br><br>첫날 조회수 <b>${fx(v.views)}회</b><br>신규 구독자 <b class="green">+${fx(v.subs)}명</b><br><br><span class="tiny">남은 조회수는 다음 날부터 순차적으로 반영돼요.</span>`,actions:[['확인','closeModal()']]};render()}
const SHARES=[.55,.25,.12,.02,.02,.02,.02];function settleVideo(v,age){if(age<0||age>=7)return 0;const amount=age===6?v.final-v.views:Math.round(v.final*SHARES[age]);const gained=Math.round(amount*v.conv);v.views+=amount;v.subs+=gained;state.views+=amount;state.subs+=gained;if(state.subs>=1000){const rev=Math.round(amount/1000*(v.format==='long'?1500:60));v.earned+=rev;state.earned+=rev;state.cash+=rev}return gained}
function nextDay(){state.day++;state.ap=4;state.energy=clamp(state.energy+35,0,100);let gained=0,earnedBefore=state.earned;for(const v of state.videos)gained+=settleVideo(v,state.day-v.day);for(let i=0;i<state.competitors.length;i++){const c=state.competitors[i];c.subs+=Math.round((16+c.subs*.018)*(0.6+Math.random()*.8))}if(state.day%30===0){const maintenance=state.gear.length*10000;state.cash-=maintenance;state.logs.unshift(`DAY ${state.day}: 장비 유지비 ${money(maintenance)} 지출`)}state.logs.unshift(`DAY ${state.day}: 기존 영상으로 구독자 +${fx(gained)}명, 광고 수익 +${money(state.earned-earnedBefore)}`);let event=null;if(state.day%8===0){event={title:'📧 광고 제안',msg:'신생 브랜드에서 제품을 소개해 달라며 광고비를 제안했어요. 하지만 제품의 평가가 좋지 않아요.',actions:[['광고 수락 (+₩500,000, 평판 -12)','sponsor(true)'],['거절 (평판 +5)','sponsor(false)']]}}else if(state.day%11===0){event={title:'💬 시청자들의 요청',msg:'시청자들이 인기 콘텐츠의 다음 편을 원해요. 어떻게 할까요?',actions:[['시청자와 소통하기 (팬 충성도 +6)','fanReply(true)'],['지금은 무시하기','fanReply(false)']]}}else{event={title:`📅 DAY ${state.day} 정산 완료`,msg:`기존 영상에서 신규 구독자 <b class="green">+${fx(gained)}명</b><br>광고 수익 <b>${money(state.earned-earnedBefore)}</b><br>체력 +35 · AP 4로 회복`,actions:[['확인','closeModal()']]}}modal=event;save();render()}
function sponsor(yes){if(yes){state.cash+=500000;state.rep=clamp(state.rep-12,0,100);state.logs.unshift('광고 제안 수락: +₩500,000 / 평판 -12')}else{state.rep=clamp(state.rep+5,0,100);state.logs.unshift('광고 제안 거절: 평판 +5')}save();modal=null;render()}function fanReply(yes){if(yes)state.loyalty=clamp(state.loyalty+6,0,100);state.logs.unshift(yes?'시청자와 소통: 팬 충성도 +6':'시청자 요청을 넘겼습니다');save();modal=null;render()}function closeModal(){modal=null;render()}
function studio(){return `<div class="section" style="margin-top:0">채널 스튜디오</div><div class="grid"><div class="card"><div class="label">구독자</div><div class="stat">${fx(state.subs)}</div></div><div class="card"><div class="label">전체 조회수</div><div class="stat">${fx(state.views)}</div></div><div class="card"><div class="label">광고 수익 누적</div><div class="stat" style="font-size:16px">${money(state.earned)}</div></div><div class="card"><div class="label">팬 충성도</div><div class="stat">${state.loyalty}/100</div></div></div><div class="section">업로드한 영상 (${state.videos.length})</div>${state.videos.length?`<div class="card">${state.videos.map(v=>`<div class="video"><b>${esc(v.title)}</b> ${v.viral?tag('바이럴'):''}<div class="dim">DAY ${v.day} · ${v.format==='long'?'롱폼':'쇼츠'} · 품질 ${v.quality}점</div><div style="margin-top:6px">👁 ${fx(v.views)}회　<span class="green">+${fx(v.subs)}명</span></div><div class="tiny">누적 수익 ${money(v.earned)} · 7일 예상 ${fx(v.final)}회</div><div class="progress"><div style="width:${clamp(v.views/v.final*100,0,100)}%"></div></div></div>`).join('')}</div>`:'<div class="card tiny">아직 업로드한 영상이 없어요. 제작 탭에서 첫 영상을 만들어 보세요.</div>'}`}
function social(){const all=[{name:state.name,subs:state.subs,you:true},...state.competitors].sort((a,b)=>b.subs-a.subs);return `<div class="section" style="margin-top:0">크리에이터 랭킹</div><div class="card">${all.map((c,i)=>`<div class="rankrow"><div>${i+1}위 · <b>${esc(c.name)}</b> ${c.you?tag('나'):''}</div><b>${fx(c.subs)}</b></div>`).join('')}</div><div class="section">크리에이터 뉴스</div><div class="card"><b>🔥 ${trends(state.day).sort((a,b)=>b.score-a.score)[0].g} 인기 상승</b><p class="tiny">지금 해당 장르의 콘텐츠를 제작하면 알고리즘 추천에 유리할 수 있어요.</p><hr class="divider"><b>🏆 라이벌 채널 경쟁</b><p class="tiny">라이벌도 매일 구독자가 늘어납니다. 영상 제작과 트렌드 전략으로 앞질러 보세요.</p></div><div class="section">시청자 커뮤니티</div><div class="card"><b>@열혈시청자</b><p>다음 영상도 기대하고 있어요! 오늘도 재미있는 콘텐츠 부탁해요 😄</p><div class="tiny">팬 충성도 ${state.loyalty}/100</div>${btn('팬들과 소통하기 (AP 1)','community()', 'btn alt',state.ap<1)}</div>`}function community(){if(state.ap<1)return;state.ap--;state.loyalty=clamp(state.loyalty+2,0,100);state.rep=clamp(state.rep+1,0,100);state.logs.unshift(`DAY ${state.day}: 팬과 소통, 충성도 +2`);save();notify('팬 충성도 +2 · 평판 +1')}
function buy(id){const item=price.find(p=>p.id===id);if(!item||state.gear.includes(id)||state.cash<item.p)return;state.cash-=item.p;state.gear.push(id);state.logs.unshift(`${item.name} 구매: ${money(item.p)} 지출`);save();notify(`${item.name} 구매 완료!`)}function business(){return `<div class="section" style="margin-top:0">비즈니스 센터</div><div class="card"><div class="label">보유 자금</div><div class="big">${money(state.cash)}</div><div class="tiny">구독자 1,000명부터 영상 광고 수익이 발생해요.</div></div><div class="section">장비 상점</div>${price.map(p=>`<div class="card"><div class="split"><div><b>${p.name}</b><div class="tiny">${p.desc}</div></div><b>${money(p.p)}</b></div>${btn(state.gear.includes(p.id)?'구매 완료':state.cash<p.p?'자금 부족':'구매하기',`buy('${p.id}')`,'btn alt',state.gear.includes(p.id)||state.cash<p.p)}</div>`).join('')}<div class="section">MCN 회사</div><div class="card"><b>🔒 회사 설립</b><p class="tiny">구독자 100만 명부터 해금 예정. 정식 업데이트에서 직원 고용 및 소속 크리에이터 경영을 추가할 거예요.</p><div class="progress"><div style="width:${clamp(state.subs/1000000*100,0,100)}%"></div></div><div class="dim" style="margin-top:8px">진행도 ${Math.min(100,state.subs/10000).toFixed(2)}%</div></div><div class="section">게임 관리</div><div class="card">${btn('저장 데이터 내보내기','exportSave()','btn alt')}${btn('새 게임 시작 (저장 초기화)','confirmReset()','btn light')}</div>`}function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='creator-world-save.json';a.click();URL.revokeObjectURL(a.href)}function confirmReset(){modal={title:'정말 새로 시작할까요?',msg:'기존 저장 데이터가 삭제돼요. 되돌릴 수 없어요.',actions:[['취소','closeModal()'],['저장 삭제 후 새 게임','resetGame()']]};render()}function resetGame(){localStorage.removeItem(K);state=null;modal=null;render()}function render(){if(!state){setup();return}app.innerHTML=head()+`<main class="body">${tab==='home'?home():tab==='create'?create():tab==='studio'?studio():tab==='social'?social():business()}</main>`+foot()+(modal?`<div class="modalbg"><div class="modal"><h2 style="margin-top:0">${modal.title}</h2><div style="margin-bottom:16px">${modal.msg}</div>${modal.actions.map(a=>btn(a[0],a[1],a[1]==='closeModal()'?'btn alt':'btn')).join('')}</div></div>`:'')+(toast?`<div class="toast">${esc(toast)}</div>`:'')};render();
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script></body></html>
